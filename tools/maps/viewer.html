<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TDMAP v7 Viewer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background: #1a1a2e;
            color: #eee;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background: #16213e;
            padding: 10px 16px;
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
        }
        h1 { font-size: 16px; font-weight: 500; margin: 0; }
        input[type=file] { font-size: 13px; color: #ccc; }
        label { font-size: 13px; color: #aaa; }
        select, button {
            background: #0f3460; color: #fff; border: 0;
            padding: 5px 10px; border-radius: 4px; font-size: 13px;
            cursor: pointer;
        }
        main { flex: 1; display: flex; min-height: 0; }
        #info {
            width: 300px;
            background: #11142a;
            padding: 12px 16px;
            overflow-y: auto;
            font-size: 12px;
            font-family: ui-monospace, monospace;
            white-space: pre-wrap;
            border-right: 1px solid #2a2a4a;
        }
        #canvas-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a1a;
            position: relative;
            overflow: hidden;
        }
        canvas { background: #1a1a2e; cursor: grab; }
        canvas:active { cursor: grabbing; }
        .status {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(0,0,0,0.6);
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 12px;
            font-family: ui-monospace, monospace;
        }
    </style>
</head>
<body>
    <header>
        <h1>TDMAP v7 Viewer</h1>
        <input type="file" id="file-input" accept=".tdmap">
        <label>Zoom <select id="zoom-select"></select></label>
        <label>Theme
            <select id="theme-select">
                <option value="dark">Dark</option>
                <option value="light">Light</option>
            </select>
        </label>
        <button id="fit-btn">Fit to bounds</button>
    </header>
    <main>
        <div id="info">Drop a .tdmap file or pick one above.</div>
        <div id="canvas-wrap">
            <canvas id="canvas" width="800" height="600"></canvas>
            <div class="status" id="status"></div>
        </div>
    </main>

<script>
// ============================================================================
// TDMAP v7 decoder
// ============================================================================
//
// Mirrors tools/maps/tdmap.py and lua/services/map_archive.lua. The wire
// format is documented in CLAUDE.md ("TDMAP format (v7)"); this file is
// the reference JS implementation for browser-side preview.

const TDMAP_VERSION = 7;
const INDEX_ENTRY_SIZE = 14;
const LABEL_FIXED_SIZE = 11;

const FEATURE_NAMES = ['Land', 'Water', 'Park', 'Building',
                       'RoadMinor', 'RoadMajor', 'Highway', 'Railway'];

const PALETTES = {
    dark: {
        tiles: ['#212421', '#19326B', '#19632A', '#4A4A4A',
                '#73738E', '#949494', '#B5B5B5', '#D6D6D6'],
        label: '#fff', halo: '#000',
    },
    light: {
        tiles: ['#FFFFFF', '#A6CEEF', '#CFE7B9', '#D6D6D6',
                '#8C8C8C', '#636363', '#424242', '#313131'],
        label: '#000', halo: '#fff',
    },
};

function readU8(view, off)  { return view.getUint8(off); }
function readU16(view, off) { return view.getUint16(off, true); }
function readU32(view, off) { return view.getUint32(off, true); }
function readI8(view, off)  { return view.getInt8(off); }
function readI32(view, off) { return view.getInt32(off, true); }
function readI16(view, off) { return view.getInt16(off, true); }

async function inflate(bytes) {
    // Browser zlib via DecompressionStream — Chrome/Edge/Firefox/Safari.
    const ds = new DecompressionStream('deflate');
    const stream = new Response(new Blob([bytes]).stream().pipeThrough(ds));
    return new Uint8Array(await stream.arrayBuffer());
}

async function parseTdmap(arrayBuffer) {
    const u8 = new Uint8Array(arrayBuffer);
    const view = new DataView(arrayBuffer);

    const magic = String.fromCharCode(...u8.slice(0, 5));
    if (magic !== 'TDMAP') throw new Error('Not a TDMAP archive (bad magic)');

    const version = readU8(view, 6);
    if (version !== TDMAP_VERSION) {
        throw new Error(
            `Unsupported TDMAP version ${version}: this viewer reads v${TDMAP_VERSION} only`);
    }
    const compression = readU8(view, 7);
    if (compression !== 2) throw new Error(`Unsupported compression ${compression}`);

    const gridDim = readU16(view, 8) || 256;
    const geomCount = readU32(view, 11);
    const indexOffset = readU32(view, 15);
    const dataOffset = readU32(view, 19);
    const minZoom = readI8(view, 23);
    const maxZoom = readI8(view, 24);
    const labelOffset = readU32(view, 25);
    const labelCount = readU32(view, 29);

    // Metadata block (4-byte length + TLV payload).
    const metaLen = readU32(view, 33);
    const metadata = { region: null, bounds: null, built: null, tool: null };
    let p = 37;
    const end = 37 + metaLen;
    while (p + 4 <= end) {
        const tag = String.fromCharCode(u8[p], u8[p + 1]);
        const vlen = readU16(view, p + 2);
        const value = u8.slice(p + 4, p + 4 + vlen);
        if (tag === 'RG') {
            metadata.region = new TextDecoder().decode(value);
        } else if (tag === 'BB' && vlen === 16) {
            const sv = new DataView(value.buffer, value.byteOffset, value.byteLength);
            metadata.bounds = {
                south: readI32(sv, 0) / 1e6,
                west:  readI32(sv, 4) / 1e6,
                north: readI32(sv, 8) / 1e6,
                east:  readI32(sv, 12) / 1e6,
            };
        } else if (tag === 'TS' && vlen === 8) {
            const ts = readU32(new DataView(value.buffer, value.byteOffset), 0);
            metadata.built = new Date(ts * 1000);
        } else if (tag === 'TV') {
            metadata.tool = new TextDecoder().decode(value);
        }
        p += 4 + vlen;
    }
    if (!metadata.bounds) throw new Error('v7 archive missing BB metadata');

    // Index.
    const entries = [];
    for (let i = 0; i < geomCount; ++i) {
        const base = indexOffset + i * INDEX_ENTRY_SIZE;
        entries.push({
            cellIndex: readU32(view, base),
            featureClass: readU8(view, base + 4),
            geomType: readU8(view, base + 5),
            minZoom: readU8(view, base + 6),
            maxZoom: readU8(view, base + 7),
            dataOffset: readU32(view, base + 8),
            dataSize: readU16(view, base + 12),
        });
    }

    // Decode all geometries (browser memory is cheap, regional archives are
    // single-digit MB).
    for (const e of entries) {
        const comp = u8.slice(dataOffset + e.dataOffset,
                              dataOffset + e.dataOffset + e.dataSize);
        const raw = await inflate(comp);
        const rv = new DataView(raw.buffer, raw.byteOffset, raw.byteLength);
        const n = raw[0];
        let lat = readI32(rv, 1);
        let lon = readI32(rv, 5);
        const verts = [[lat / 1e6, lon / 1e6]];
        let pos = 9;
        for (let v = 1; v < n; ++v) {
            lat += readI16(rv, pos);
            lon += readI16(rv, pos + 2);
            pos += 4;
            verts.push([lat / 1e6, lon / 1e6]);
        }
        e.verts = verts;
    }

    // Labels.
    const labels = [];
    let lp = labelOffset;
    for (let i = 0; i < labelCount; ++i) {
        if (lp + LABEL_FIXED_SIZE >= u8.length) break;
        const lat = readI32(view, lp) / 1e6;
        const lon = readI32(view, lp + 4) / 1e6;
        const zmin = readU8(view, lp + 8);
        const zmax = readU8(view, lp + 9);
        const ltype = readU8(view, lp + 10);
        const tlen = readU8(view, lp + 11);
        const text = new TextDecoder().decode(u8.slice(lp + 12, lp + 12 + tlen));
        labels.push({ lat, lon, zmin, zmax, type: ltype, text });
        lp += LABEL_FIXED_SIZE + 1 + tlen;
    }

    return { version, gridDim, geomCount, minZoom, maxZoom,
             metadata, entries, labels };
}

// ============================================================================
// Renderer
// ============================================================================

function latLonToMerc(lat, lon) {
    const x = (lon + 180) / 360;
    const sinLat = Math.sin(lat * Math.PI / 180);
    const y = 0.5 - Math.log((1 + sinLat) / (1 - sinLat)) / (4 * Math.PI);
    return [x, y];
}

function render(canvas, archive, view) {
    const ctx = canvas.getContext('2d');
    const palette = PALETTES[view.theme];
    ctx.fillStyle = palette.tiles[0];
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const z = view.zoom;
    const n = 2 ** z;
    const [cmx, cmy] = latLonToMerc(view.centerLat, view.centerLon);
    const cxPx = cmx * n * 256;
    const cyPx = cmy * n * 256;

    function project(lat, lon) {
        const [mx, my] = latLonToMerc(lat, lon);
        return [mx * n * 256 - cxPx + canvas.width / 2,
                my * n * 256 - cyPx + canvas.height / 2];
    }

    const polys = archive.entries.filter(e => e.geomType === 1
                                          && z >= e.minZoom && z <= e.maxZoom);
    const lines = archive.entries.filter(e => e.geomType === 0
                                          && z >= e.minZoom && z <= e.maxZoom);
    polys.sort((a, b) => a.featureClass - b.featureClass);
    lines.sort((a, b) => a.featureClass - b.featureClass);

    for (const e of polys) {
        ctx.fillStyle = palette.tiles[e.featureClass] || palette.tiles[0];
        ctx.beginPath();
        e.verts.forEach(([lat, lon], i) => {
            const [x, y] = project(lat, lon);
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        });
        ctx.closePath();
        ctx.fill();
    }

    const widthFor = fc => fc === 6 ? 3 : (fc === 5 ? 2 : 1);
    for (const e of lines) {
        ctx.strokeStyle = palette.tiles[e.featureClass] || palette.tiles[7];
        ctx.lineWidth = widthFor(e.featureClass);
        ctx.beginPath();
        e.verts.forEach(([lat, lon], i) => {
            const [x, y] = project(lat, lon);
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        });
        ctx.stroke();
    }

    ctx.font = '13px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const l of archive.labels) {
        if (z < l.zmin || z > l.zmax) continue;
        const [x, y] = project(l.lat, l.lon);
        if (x < 0 || x > canvas.width || y < 0 || y > canvas.height) continue;
        ctx.lineWidth = 3;
        ctx.strokeStyle = palette.halo;
        ctx.strokeText(l.text, x, y);
        ctx.fillStyle = palette.label;
        ctx.fillText(l.text, x, y);
    }
}

// ============================================================================
// Wiring
// ============================================================================

let archive = null;
const view = { zoom: 11, centerLat: 0, centerLon: 0, theme: 'dark' };
const canvas = document.getElementById('canvas');
const info = document.getElementById('info');
const status = document.getElementById('status');
const zoomSelect = document.getElementById('zoom-select');
const themeSelect = document.getElementById('theme-select');
const fitBtn = document.getElementById('fit-btn');

function rerender() {
    if (!archive) return;
    render(canvas, archive, view);
    status.textContent = `z${view.zoom}  ${view.centerLat.toFixed(4)},${view.centerLon.toFixed(4)}`;
}

function showInfo() {
    if (!archive) {
        info.textContent = 'Drop a .tdmap file or pick one above.';
        return;
    }
    const byFeature = {};
    for (const e of archive.entries) {
        byFeature[e.featureClass] = (byFeature[e.featureClass] || 0) + 1;
    }
    const b = archive.metadata.bounds;
    const lines = [
        `version       ${archive.version}`,
        `grid_dim      ${archive.gridDim}`,
        `geometries    ${archive.geomCount}`,
        `labels        ${archive.labels.length}`,
        `zoom range    ${archive.minZoom}..${archive.maxZoom}`,
        '',
        'Metadata:',
        `  region   ${archive.metadata.region || '-'}`,
        `  bounds   ${b ? `${b.west.toFixed(2)},${b.south.toFixed(2)} -> ${b.east.toFixed(2)},${b.north.toFixed(2)}` : '-'}`,
        `  built    ${archive.metadata.built ? archive.metadata.built.toISOString() : '-'}`,
        `  tool     ${archive.metadata.tool || '-'}`,
        '',
        'Geometries by feature:',
        ...FEATURE_NAMES.map((nm, i) => `  ${i} ${nm.padEnd(11)} ${(byFeature[i] || 0)}`),
    ];
    info.textContent = lines.join('\n');
}

document.getElementById('file-input').addEventListener('change', async (ev) => {
    const file = ev.target.files[0];
    if (!file) return;
    status.textContent = 'parsing...';
    try {
        archive = await parseTdmap(await file.arrayBuffer());
    } catch (err) {
        info.textContent = 'Error: ' + err.message;
        return;
    }
    const b = archive.metadata.bounds;
    view.centerLat = (b.north + b.south) / 2;
    view.centerLon = (b.east + b.west) / 2;
    view.zoom = archive.minZoom;
    zoomSelect.innerHTML = '';
    for (let z = archive.minZoom; z <= archive.maxZoom; ++z) {
        const opt = document.createElement('option');
        opt.value = z; opt.textContent = `z${z}`;
        zoomSelect.appendChild(opt);
    }
    zoomSelect.value = view.zoom;
    showInfo();
    rerender();
});

zoomSelect.addEventListener('change', () => {
    view.zoom = parseInt(zoomSelect.value, 10);
    rerender();
});
themeSelect.addEventListener('change', () => {
    view.theme = themeSelect.value;
    rerender();
});
fitBtn.addEventListener('click', () => {
    if (!archive) return;
    const b = archive.metadata.bounds;
    view.centerLat = (b.north + b.south) / 2;
    view.centerLon = (b.east + b.west) / 2;
    rerender();
});

let dragging = false; let lastX = 0; let lastY = 0;
canvas.addEventListener('mousedown', (e) => {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener('mouseup', () => { dragging = false; });
window.addEventListener('mousemove', (e) => {
    if (!dragging || !archive) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    const n = 2 ** view.zoom;
    const [cmx, cmy] = latLonToMerc(view.centerLat, view.centerLon);
    const newX = cmx * n - dx / 256;
    const newY = cmy * n - dy / 256;
    const lon = (newX / n) * 360 - 180;
    const sinhArg = Math.PI * (1 - 2 * newY / n);
    const lat = Math.atan(Math.sinh(sinhArg)) * 180 / Math.PI;
    view.centerLat = lat;
    view.centerLon = lon;
    rerender();
});

canvas.addEventListener('wheel', (e) => {
    if (!archive) return;
    e.preventDefault();
    const newZoom = Math.max(archive.minZoom,
                             Math.min(archive.maxZoom,
                                      view.zoom + (e.deltaY < 0 ? 1 : -1)));
    if (newZoom !== view.zoom) {
        view.zoom = newZoom;
        zoomSelect.value = view.zoom;
        rerender();
    }
});

showInfo();
</script>
</body>
</html>
