name: Main Branch Artifacts

on:
  push:
    branches:
      - main
    # Don't retrigger on our own release commits (which only touch the
    # generated changelog / version-stamp files). [skip ci] in the
    # commit message is the belt; this is the suspenders.
    paths-ignore:
      - 'changelog/versions.json'
      - 'changelog/archive.json'
      - 'lua/docs/changelog.json'
      - 'CHANGELOG.md'
      - 'platformio.ini'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install PlatformIO, esptool, and PyNaCl
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool pynacl

      - name: Fetch PlatformIO dependencies
        run: pio pkg install -e t-deck-plus

      - name: Configure git for release commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Generate changelog, sync version, and push back
        id: changelog
        run: |
          npm ci
          # --push pushes the release commit + tag back to main so
          # versions.json[0].commit advances each run. Without this,
          # subsequent runs all compute "next version" against a frozen
          # anchor and the published version label drifts non-
          # monotonically; the version-bump-required PR gate also has
          # nothing real to anchor against.
          #
          # [skip ci] in the message keeps the resulting push from
          # re-triggering this workflow (paths-ignore above is the
          # primary loop-break; this is defense in depth).
          #
          # No retry on push race: if origin advances during the run,
          # xtr-changelog --push fails non-FF and the workflow errors
          # out. The next push (manual or otherwise) will produce a
          # fresh release. xtr-changelog's --push isn't atomic, so a
          # rejected branch push may still leave a tag on origin; if
          # that happens, delete the orphan tag manually
          # (`git push origin :refs/tags/vX.Y.Z`). Tracked upstream as
          # https://github.com/xtr-dev/changelog/issues/1.
          npx xtr-changelog release \
            --execute --commit --tag --push \
            --message '[skip ci] chore(release): {version}'

          cp changelog/versions.json lua/docs/changelog.json
          # Stamp the just-released version into platformio.ini so the
          # built binary reports the same version string. Note: this
          # edit is local to the runner -- it is not committed back to
          # the branch (nor needs to be: the version is derivable from
          # versions.json[0]). If you want platformio.ini's checked-in
          # version to track too, amend the release commit before
          # --push above. Today it lags by exactly one release.
          VERSION=$(node -e "const v=require('./changelog/versions.json'); console.log(v.versions[0].version)")
          sed -i "s/^custom_version *= *.*/custom_version = ${VERSION}/" platformio.ini
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build 32-bit luac for bytecode embedding
        run: |
          mkdir -p tools/bin
          LUA_SRC=".pio/libdeps/t-deck-plus/Esp32Lua/src/lua"
          if [ ! -d "$LUA_SRC" ]; then
            echo "Lua source not found at $LUA_SRC" >&2
            ls .pio/libdeps/t-deck-plus || true
            exit 1
          fi
          (cd "$LUA_SRC" && cc -O2 -DLUA_32BITS=1 -o "$GITHUB_WORKSPACE/tools/bin/luac32" \
              luac.c $(ls l*.c | grep -vE '^(lua|luac)\.c$') -lm)
          tools/bin/luac32 -v

      - name: Stamp build timestamp
        id: build_stamp
        # Captured here (not inside the build step) so the manifest
        # builder below can reference the exact same value -- the
        # firmware-update screen compares manifest.built_at against
        # the running firmware's build_at to spot downgrades, and a
        # 1-second skew from re-invoking `date` would have produced
        # spurious warnings on freshly-pushed builds.
        run: echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build firmware
        env:
          EZOS_BUILD_SHA: ${{ github.sha }}
          EZOS_BUILD_AT:  ${{ steps.build_stamp.outputs.built_at }}
        run: pio run -e t-deck-plus

      - name: Stage release artifacts
        run: |
          mkdir -p artifacts
          cp changelog/versions.json artifacts/versions.json
          cp .pio/build/t-deck-plus/firmware.bin    artifacts/firmware.bin
          cp .pio/build/t-deck-plus/bootloader.bin  artifacts/bootloader.bin
          cp .pio/build/t-deck-plus/partitions.bin  artifacts/partitions.bin
          esptool.py --chip esp32s3 merge_bin \
            -o artifacts/firmware-full.bin \
            --flash_mode dio \
            --flash_freq 80m \
            --flash_size 16MB \
            0x0000  artifacts/bootloader.bin \
            0x8000  artifacts/partitions.bin \
            0x10000 artifacts/firmware.bin

      - name: Build signed manifest
        env:
          OTA_SIGNING_PRIVKEY: ${{ secrets.OTA_SIGNING_PRIVKEY }}
        run: |
          set -euo pipefail
          FIRMWARE_BIN=artifacts/firmware.bin
          FULL_BIN=artifacts/firmware-full.bin
          SIZE=$(stat -c%s "$FIRMWARE_BIN")
          SHA256=$(sha256sum "$FIRMWARE_BIN" | awk '{print $1}')
          FULL_SIZE=$(stat -c%s "$FULL_BIN")
          FULL_SHA256=$(sha256sum "$FULL_BIN" | awk '{print $1}')
          VERSION='${{ steps.changelog.outputs.version }}'
          BUILT_AT='${{ steps.build_stamp.outputs.built_at }}'
          BIN_URL="https://github.com/${{ github.repository }}/releases/download/rolling-main/firmware.bin"
          FULL_BIN_URL="https://github.com/${{ github.repository }}/releases/download/rolling-main/firmware-full.bin"

          python -c "
          import json
          m = {
              'tag': 'rolling-main',
              'sha': '${{ github.sha }}',
              'short_sha': '${{ github.sha }}'[:7],
              'version': '$VERSION',
              'built_at': '$BUILT_AT',
              'size': $SIZE,
              'sha256': '$SHA256',
              'bin_url': '$BIN_URL',
              'full_size': $FULL_SIZE,
              'full_sha256': '$FULL_SHA256',
              'full_bin_url': '$FULL_BIN_URL',
          }
          with open('artifacts/manifest.json', 'w') as f:
              json.dump(m, f, sort_keys=True, separators=(',', ':'))
          "

          if [ -n "${OTA_SIGNING_PRIVKEY:-}" ]; then
            python tools/ota/sign_manifest.py artifacts/manifest.json
          else
            echo "::warning::OTA_SIGNING_PRIVKEY secret not set; skipping signature. Devices will refuse this manifest."
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: artifacts/*
          retention-days: 90

      - name: Publish rolling-main release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=rolling-main
          NOTES_FILE=$(mktemp)
          SHORT_SHA="${GITHUB_SHA::7}"
          cat >"$NOTES_FILE" <<EOF
          Auto-built from main on $(date -u +%Y-%m-%dT%H:%M:%SZ).

          Commit: ${GITHUB_SHA}
          Short SHA: ${SHORT_SHA}

          - firmware.bin -- application image (use this for OTA)
          - firmware-full.bin -- bootloader + partitions + app for fresh flashing
          - manifest.json + manifest.sig -- consumed by the on-device firmware-update screen
          EOF

          # Move the tag to the current commit (force-update both ref + tag).
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/${TAG}"

          # Wipe any existing release at this tag, then recreate it with
          # the freshly built assets. Easier than diffing assets.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag=false
          fi

          ASSETS=(artifacts/firmware.bin artifacts/firmware-full.bin artifacts/manifest.json artifacts/versions.json)
          if [ -f artifacts/manifest.json.sig ]; then
            ASSETS+=(artifacts/manifest.json.sig)
          fi

          gh release create "$TAG" "${ASSETS[@]}" \
            --title "Rolling main (${SHORT_SHA})" \
            --notes-file "$NOTES_FILE" \
            --prerelease

  prune:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Keep only the 3 most recent main builds
        uses: actions/github-script@v7
        with:
          script: |
            const KEEP = 3;
            const PREFIX = 'firmware-';

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );

            const matching = artifacts
              .filter(a => a.name.startsWith(PREFIX) && !a.expired)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            const toDelete = matching.slice(KEEP);
            core.info(`${matching.length} artifacts, deleting ${toDelete.length}`);

            for (const artifact of toDelete) {
              core.info(`Deleting ${artifact.name} (id=${artifact.id}, created=${artifact.created_at})`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }
