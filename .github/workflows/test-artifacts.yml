name: Test Branch Artifacts

on:
  push:
    branches:
      - test
    # Don't retrigger when our own release commit pushes generated
    # changelog/version-stamp files back to the branch. Belt + suspenders
    # with [skip ci] in the release commit message.
    paths-ignore:
      - 'changelog/versions.json'
      - 'changelog/archive.json'
      - 'lua/docs/changelog.json'
      - 'CHANGELOG.md'
      - 'platformio.ini'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The test workflow regenerates lua/docs/changelog.json into
          # the workspace at build time but never pushes back to the
          # branch (releases land only on main), so no deploy key is
          # needed here. fetch-depth + fetch-tags are still required:
          # xtr-changelog walks git log from the latest local `v*` tag
          # to derive entries since the last release. With a shallow
          # checkout it falls back to package.json#version and re-stamps
          # the same patch number, and the embedded changelog loses
          # entries.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install PlatformIO, esptool, and PyNaCl
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool pynacl

      - name: Fetch PlatformIO dependencies
        run: pio pkg install -e t-deck-plus

      - name: Regenerate embedded changelog and stamp synthetic version
        id: changelog
        run: |
          npm ci
          # Anchor the test-channel version to the last main release
          # BEFORE running xtr-changelog -- `release --execute` rewrites
          # versions.json[0] with an unreleased entry we don't want to
          # ship as the build's version.
          MAIN_VERSION=$(node -e "console.log(require('./changelog/versions.json').versions[0].version)")
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION="${MAIN_VERSION}+test.${SHORT_SHA}"

          # `release --execute` without --commit/--tag/--push rewrites
          # versions.json / archive.json / CHANGELOG.md / package.json
          # in the runner workspace only. Nothing is committed back --
          # that's the point of issue #102: those four files no longer
          # diverge between `test` and `main`, so promotions stop
          # conflicting on them.
          npx xtr-changelog release --execute

          # whats_new.lua reads this via ez.docs.read("@changelog.json").
          # Regenerating per-build means the test channel shows entries
          # not yet promoted to main.
          cp changelog/versions.json lua/docs/changelog.json

          # Stamps EZOS_VERSION via embed_lua_scripts.py. Workspace-only.
          sed -i "s/^custom_version *= *.*/custom_version = ${VERSION}/" platformio.ini
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build 32-bit luac for bytecode embedding
        run: |
          mkdir -p tools/bin
          LUA_SRC=".pio/libdeps/t-deck-plus/Esp32Lua/src/lua"
          if [ ! -d "$LUA_SRC" ]; then
            echo "Lua source not found at $LUA_SRC" >&2
            ls .pio/libdeps/t-deck-plus || true
            exit 1
          fi
          (cd "$LUA_SRC" && cc -O2 -DLUA_32BITS=1 -o "$GITHUB_WORKSPACE/tools/bin/luac32" \
              luac.c $(ls l*.c | grep -vE '^(lua|luac)\.c$') -lm)
          tools/bin/luac32 -v

      - name: Stamp build timestamp
        id: build_stamp
        run: echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build firmware
        env:
          EZOS_BUILD_SHA: ${{ github.sha }}
          EZOS_BUILD_AT:  ${{ steps.build_stamp.outputs.built_at }}
        run: pio run -e t-deck-plus

      - name: Stage release artifacts
        run: |
          mkdir -p artifacts
          cp changelog/versions.json artifacts/versions.json
          cp .pio/build/t-deck-plus/firmware.bin    artifacts/firmware.bin
          cp .pio/build/t-deck-plus/bootloader.bin  artifacts/bootloader.bin
          cp .pio/build/t-deck-plus/partitions.bin  artifacts/partitions.bin
          esptool.py --chip esp32s3 merge_bin \
            -o artifacts/firmware-full.bin \
            --flash_mode dio \
            --flash_freq 80m \
            --flash_size 16MB \
            0x0000  artifacts/bootloader.bin \
            0x8000  artifacts/partitions.bin \
            0x10000 artifacts/firmware.bin

      - name: Build signed manifest
        env:
          OTA_SIGNING_PRIVKEY: ${{ secrets.OTA_SIGNING_PRIVKEY }}
        run: |
          set -euo pipefail
          FIRMWARE_BIN=artifacts/firmware.bin
          FULL_BIN=artifacts/firmware-full.bin
          SIZE=$(stat -c%s "$FIRMWARE_BIN")
          SHA256=$(sha256sum "$FIRMWARE_BIN" | awk '{print $1}')
          FULL_SIZE=$(stat -c%s "$FULL_BIN")
          FULL_SHA256=$(sha256sum "$FULL_BIN" | awk '{print $1}')
          VERSION='${{ steps.changelog.outputs.version }}'
          BUILT_AT='${{ steps.build_stamp.outputs.built_at }}'
          BIN_URL="https://github.com/${{ github.repository }}/releases/download/rolling-test/firmware.bin"
          FULL_BIN_URL="https://github.com/${{ github.repository }}/releases/download/rolling-test/firmware-full.bin"

          python -c "
          import json
          m = {
              'tag': 'rolling-test',
              'sha': '${{ github.sha }}',
              'short_sha': '${{ github.sha }}'[:7],
              'version': '$VERSION',
              'built_at': '$BUILT_AT',
              'size': $SIZE,
              'sha256': '$SHA256',
              'bin_url': '$BIN_URL',
              'full_size': $FULL_SIZE,
              'full_sha256': '$FULL_SHA256',
              'full_bin_url': '$FULL_BIN_URL',
          }
          with open('artifacts/manifest.json', 'w') as f:
              json.dump(m, f, sort_keys=True, separators=(',', ':'))
          "

          if [ -n "${OTA_SIGNING_PRIVKEY:-}" ]; then
            python tools/ota/sign_manifest.py artifacts/manifest.json
          else
            echo "::warning::OTA_SIGNING_PRIVKEY secret not set; skipping signature. Devices will refuse this manifest."
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-test-${{ github.sha }}
          path: artifacts/*
          retention-days: 90

      - name: Publish rolling-test release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=rolling-test
          NOTES_FILE=$(mktemp)
          SHORT_SHA="${GITHUB_SHA::7}"
          cat >"$NOTES_FILE" <<EOF
          Auto-built from test on $(date -u +%Y-%m-%dT%H:%M:%SZ).

          Commit: ${GITHUB_SHA}
          Short SHA: ${SHORT_SHA}

          - firmware.bin -- application image (use this for OTA)
          - firmware-full.bin -- bootloader + partitions + app for fresh flashing
          - manifest.json + manifest.sig -- consumed by the on-device firmware-update screen
          EOF

          # Move the tag to the current commit (force-update both ref + tag).
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/${TAG}"

          # Wipe any existing release at this tag, then recreate it with
          # the freshly built assets. Easier than diffing assets.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag=false
          fi

          ASSETS=(artifacts/firmware.bin artifacts/firmware-full.bin artifacts/manifest.json artifacts/versions.json)
          if [ -f artifacts/manifest.json.sig ]; then
            ASSETS+=(artifacts/manifest.json.sig)
          fi

          gh release create "$TAG" "${ASSETS[@]}" \
            --title "Rolling test (${SHORT_SHA})" \
            --notes-file "$NOTES_FILE" \
            --prerelease

  prune:
    needs: build
    runs-on: ubuntu-latest
    # actions: write lives only on this job (the one that calls
    # deleteArtifact) so a supply-chain compromise during the build
    # job's npm/pip installs can't silently delete other workflow
    # artifacts. contents: write is inherited from the workflow
    # level but isn't used here.
    permissions:
      actions: write
    steps:
      - name: Keep only the 3 most recent test builds
        uses: actions/github-script@v7
        with:
          script: |
            const KEEP = 3;
            const PREFIX = 'firmware-test-';

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );

            const matching = artifacts
              .filter(a => a.name.startsWith(PREFIX) && !a.expired)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            const toDelete = matching.slice(KEEP);
            core.info(`${matching.length} artifacts, deleting ${toDelete.length}`);

            for (const artifact of toDelete) {
              core.info(`Deleting ${artifact.name} (id=${artifact.id}, created=${artifact.created_at})`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }
